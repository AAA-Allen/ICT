[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ict2-fitness-backend"
version = "0.1.0"
description = "Local fitness video analysis API and evidence-bound Agent feedback"
requires-python = ">=3.10"
dependencies = ["agent-core>=0.4.0,<0.5"]

[project.scripts]
fitness-backend = "fitness_backend.server:main"

[tool.setuptools]
packages = ["fitness_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
