name: CI

on:
  push:
  pull_request:

jobs:
  frontend-tests:
    name: Frontend approval / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check workbench syntax
        run: node --check frontend/app.js
      - name: Check approval credentials, races and stream replay
        run: node --test tests/frontend_approval.test.cjs tests/frontend_streaming.test.cjs tests/frontend_harness.test.cjs tests/frontend_auth.test.cjs tests/frontend_views.test.cjs tests/frontend_assets.test.cjs

  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Check sequential resource smoke
        run: python -m examples.resource_baseline --rounds 16
      - name: Verify installed wheel outside checkout
        run: python tools/verify_distribution.py dist
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-py${{ matrix.python-version }}
          path: outputs/distribution/
          if-no-files-found: ignore
      - name: Upload resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-${{ matrix.os }}-py${{ matrix.python-version }}
          path: outputs/resource-baseline/
          if-no-files-found: ignore
